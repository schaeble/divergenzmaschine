kam mit einem feinen Riss darin.","Man wusste, dass man diesen Moment später vermissen würde.","Selbst das Licht schien sich langsam zu verabschieden.","Es war schön gewesen, und genau das machte es schwer."]},dark:{opener:["Von der ersten Sekunde an fühlte sich hier nichts richtig an.","Es begann leise - so, wie das Schlimmste meistens beginnt.","Manche Orte warten nur darauf, dass jemand kommt.","Es gab keinen Ausweg, nur die Illusion davon.","Was folgte, hätte niemand aufhalten können.","Die Dunkelheit hier war älter als das Haus, das sie barg."],flavor:["Nichts daran fühlte sich je wirklich sicher an.","Etwas darin roch unverkennbar nach Verlust.","Die Kälte blieb, auch als längst niemand mehr hinsah.","Es war die Art von Stille, die etwas Schlimmeres ankündigt.","Irgendwo darunter wartete bereits das nächste Unglück.","Kein Trost weit und breit - nur die Gewissheit, dass es schlimmer werden würde.","Jeder Ausweg führte nur tiefer hinein.","Etwas beobachtete, ohne je gesehen zu werden.","Die Hoffnung war das Erste, was hier starb.","Man spürte, dass die Wände zuhörten.","Es war zu spät, schon bevor es begann.","Selbst das Schweigen hatte hier Zähne."]},unheimlich:{opener:["Alles wirkte vertraut, und genau das war das Problem.","Irgendetwas war anders, aber man konnte nicht sagen, was.","Die Dinge standen zu still, um natürlich zu sein.","Es war, als hätte jemand die Welt fast, aber nicht ganz richtig nachgebaut.","Man hatte das Gefühl, nicht allein zu sein - ohne Beweis dafür.","Etwas stimmte mit den Schatten nicht."],flavor:["Die Spiegel schienen einen Sekundenbruchteil zu spät zu reagieren.","Ein Geräusch, das nur existierte, wenn man nicht hinhörte.","Die Gesichter waren richtig, nur das Lächeln saß falsch.","Etwas zählte mit, jedes Mal, wenn man die Tür schloss.","Die Uhr ging, aber die Zeit stand.","Man erkannte den Raum wieder, ohne je dort gewesen zu sein.","Die Stille hatte eine Form, und sie kam näher.","Irgendwo atmete etwas im Takt der eigenen Schritte.","Ein Detail war zu viel im Bild, und keiner sah es an.","Es fühlte sich an, als würde man erwartet."]},uplifting:{opener:["Und doch beginnt hier, allen Umständen zum Trotz, etwas Gutes.","Selbst an diesem Ort ließ sich noch Hoffnung finden.","Manchmal reicht ein einziger Moment, um alles zu wenden.","Es sah aussichtslos aus - und war es dann doch nicht.","Irgendwo darin lag der Anfang von etwas Besserem.","Gerade als alles verloren schien, kam das Licht zurück."],flavor:["Und doch blieb, gegen jede Erwartung, ein Rest Hoffnung.","Irgendetwas darin fühlte sich nach einem echten Neuanfang an.","Es war, als würde sich gerade, ganz leise, etwas zum Guten wenden.","Ein kleiner Trost blieb trotzdem - und manchmal reicht genau das.","Selbst im Schwierigsten fand sich noch ein Grund zum Weitermachen.","Am Ende zählte nicht der Verlust, sondern das, was blieb.","Eine unerwartete Freundlichkeit veränderte alles.","Zum ersten Mal seit Langem schien der Weg wieder offen.","Es war schwer gewesen, aber es hatte sich gelohnt.","Manchmal ist der Sturz nur der Anlauf.","Etwas in ihr richtete sich wieder auf.","Und plötzlich schien alles möglich."]},zaertlich:{opener:["Es geschah mit einer Behutsamkeit, die man kaum erwartet hätte.","Manche Dinge muss man leise erzählen, sonst zerbrechen sie.","Es war klein und warm und leicht zu übersehen.","Zwischen ihnen lag eine Sanftheit, für die es kein Wort gab.","Es begann mit einer Geste, die niemand sonst bemerkte.","Alles daran war sacht, fast wie Atem im Schlaf."],flavor:["Eine Hand, die blieb, obwohl sie gehen durfte.","Es war die Sorte Nähe, die keine Worte braucht.","Etwas darin passte auf einen auf, ganz unaufdringlich.","Ein Lächeln, so leise, dass man es fast überhörte.","Die Welt wurde für einen Moment weicher.","Es war ein kleines Zärtlichsein, mitten im Lärm.","Jemand hielt etwas Zerbrechliches, ohne es zu drücken.","Wärme, die keine Gegenleistung wollte.","Es fühlte sich an wie Ankommen.","Ein Trost, der einfach nur dablieb."]},traeumerisch:{opener:["Es war schwer zu sagen, ob es geschah oder nur geträumt wurde.","Die Ränder der Dinge waren an diesem Tag nicht ganz fest.","Alles trieb ein wenig, wie Boote ohne Anker.","Es fühlte sich an, als wäre man mitten in einem fremden Traum aufgewacht.","Die Logik hatte hier Urlaub genommen.","Zeit und Ort waren nur Vorschläge."],flavor:["Die Dinge verwandelten sich, kaum dass man wegsah.","Ein Zimmer wurde zum Meer, ohne dass es jemand störte.","Die Schwerkraft schien Verhandlungssache zu sein.","Man ging durch Türen, die es vorher nicht gegeben hatte.","Farben rochen, und Geräusche hatten Gewicht.","Alles ergab Sinn, solange man nicht genauer hinsah.","Die Erinnerung lief der Gegenwart voraus.","Ein Gedanke wurde Landschaft.","Nichts stand fest, und nichts fiel.","Es war schön und ungereimt wie ein Traum kurz vor dem Erwachen."]},nuechtern:{opener:["Der Reihe nach: Es geschah genau so, wie es hier steht.","Ohne Umschweife - das ist, was passierte.","Es gibt daran nichts zu beschönigen.","Die Fakten waren übersichtlich, die Folgen weniger.","Man muss es nicht ausschmücken, es genügt so.","Kurz und ohne Pathos: So lag der Fall."],flavor:["Mehr war dazu nicht zu sagen.","Die Sache hatte eine klare Ursache und eine klare Folge.","Es half nichts, es zu beschönigen.","Alles Weitere ergab sich daraus von selbst.","Nüchtern betrachtet, blieb wenig Raum für Zweifel.","Die Lage war, was sie war.","Man notierte es und ging weiter.","Kein Drama, nur der nächste Schritt.","So einfach, so unausweichlich.","Am Ende zählten nur die Zahlen."]},ironisch:{opener:["Natürlich lief alles nach Plan - nur nicht nach diesem.","Man ahnt schon, wie gut das ausgehen wird.","Es war, mit Verlaub, eine glänzende Idee. Fast.","Was hätte dabei schon schiefgehen können.","Wie schön, dass wenigstens einer den Überblick behielt. Behauptete er.","Der Plan war wasserdicht. Das Wasser fand trotzdem einen Weg."],flavor:["Es lief exakt so gut, wie zu erwarten war.","Ein voller Erfolg, wenn man die Ziele nachträglich anpasste.","Zum Glück war ja jemand zuständig - nur nicht anwesend.","Die Ironie daran entging allen Beteiligten.","Man nannte es Strategie, um nicht Zufall sagen zu müssen.","Selbstverständlich hatte niemand etwas geahnt. Angeblich.","Ein Meisterwerk der Planung, rückwärts betrachtet.","Alles unter Kontrolle, versicherte die Kontrolle.","Bemerkenswert, wie zuverlässig das Unwahrscheinliche eintraf.","Es hätte schlimmer kommen können. Kam es dann auch."]},humorous:{opener:["Es hätte ernst werden können - wurde es aber nicht ganz.","Manche Geschichten sind einfach zu absurd, um nicht zu grinsen.","Was folgt, ist mit Ansage albern.","Es begann harmlos und entglitt dann auf komische Weise.","Man sollte das nicht so ernst nehmen. Die Beteiligten taten es auch nicht.","Vorweg: Niemand kam ernsthaft zu Schaden, nur die Würde."],flavor:["Absurd genug, um fast schon wieder normal zu wirken.","Selbst das Schicksal schien dabei kurz zu grinsen.","Niemand hätte sich das so ausgedacht - und genau deshalb war es lustig.","Es hatte, aller Dramatik zum Trotz, etwas unfreiwillig Komisches.","Man hätte fast Popcorn gebraucht, so albern lief das gerade.","Selbst die Beteiligten mussten sich das Lachen verkneifen.","Es war ein Chaos, aber ein gut gelauntes.","Die Peinlichkeit war beeindruckend gleichmütig.","Am Ende lachten alle - manche sogar freiwillig.","Der Ernst der Lage hatte sichtlich Feierabend."]}},Go={neutral:{},mystery:{rhythm:"long"},poetic:{rhythm:"breath",register:"lyrical"},melancholisch:{rhythm:"long",register:"lyrical"},dark:{rhythm:"fracture",register:"dark"},unheimlich:{rhythm:"fracture",register:"dark"},uplifting:{rhythm:"clean"},zaertlich:{rhythm:"breath",register:"lyrical"},traeumerisch:{rhythm:"breath",register:"lyrical"},nuechtern:{rhythm:"clean",register:"plain"},ironisch:{rhythm:"clean",register:"wry"},humorous:{rhythm:"staccato",register:"wry"}};function Iu(e){return e?Go[e]?.rhythm:void 0}function Gu(e){return e&&Go[e]?.regi ext","kontext"),", ",Ee("Preset, Ton und Form","presetton")," entstehen die Texte. Alle ",Ee("Stil-Regler","werkzeug")," (Struktur, Modus, Perspektive, Rhythmus, Markov, Archetyp, Instabilität …), die ",Ee("Aktionen","aktionen")," Generieren/Variante/Würfeln/Merken/Tresor, das ",Ee("Editieren mit Passagen-Austausch","faerben")," sowie ",Ee("Test & Ranking","ranking"),". Eine neue Variante gibt es auch per Pfeil links/rechts im Textfenster oder per Wischen auf dem Handy.")],["Ideen",q("Prämissen-Generator: zehn Profil-Merkmale (Genre, Figurtyp, Ort, Zeit …) formen die Richtung kurzer Story-Ideen. Preset wählen, Regler selbst stellen oder per KI aus einem Thema ein Profil bauen; der Divergenz-Regler steuert die Streuung (zahm → radikal). „→ Studio“ übernimmt eine Prämisse als ",Ee("4W-Kontext","kontext"),". Eigene Profile als Preset speicherbar.")],["Welt",q("Omnikognition (Wahrnehmungs-Modus): aus dem Profil eines Lebewesens (Sinne, Zeitgefühl, Selbstmodell, soziale Kognition … zehn Kriterien) werden ",Ee("Perspektive, Rhythmus","werkzeug")," und Bildwelt geformt und ins Studio übertragen. Preset wählen, Kriterien selbst stellen oder per „KI-Profil erzeugen“ aus einem Namen bauen; eigene Profile als Preset speichern.")],["Wortbank",q("Das Material-Herz: Presets laden, Auto-Mix, Regeln-Box (wie Einträge zu schreiben sind), „Preset bearbeiten und sichern“ als Editor aller 7 Kategorien (mit Präteritum-Warnung je Kategorie und dem Offline-Knopf „Präteritum → Präsens“, der eindeutige Formen umschreibt und unsichere stehen lässt) (Motive, Haken, Requisiten, Wendungen, Hindernisse, Einsätze, Schlüsse), Mutation, Preset-Assistent und Wortarchiv (KI oder Einfügen, in Gruppen), JSON-Import/Export, „Als Preset speichern“ (schlägt den aktiven Namen vor), „Preset umbenennen“ und „Preset löschen“ für eigene Presets. „Mehrere Presets per KI aktualisieren“ verbessert Presets im Stapel; die ",Ee("Preset-2.0-Felder","preset2")," ergänzen den dramaturgischen Überbau. Unten aufklappbar die KI-Wortbank aus 4W plus Zusatzvorgabe.")],["Korpus",q("Eigener Trainingstext für den ",Ee("Markov-Generator","werkzeug"),". Der Schalter ",s("b",{},"Selbstfütterung")," nimmt zusätzlich den Siegertext jeder Generierung mit ",Ee("Bestenauslese","ranking")," auf — ohne ihn wächst der Korpus nur über „Merken“ und Handeingabe, und ein leerer Korpus bedeutet: der Markov-Regler bewirkt nichts. Die Maschine lernt dann auch aus ihren eigenen Texten; das schärft den Ton, kann aber Wendungen verfestigen, deshalb gelegentlich säubern. Vorgabe: aus. „Säubern“ segmentiert satzweise und entfernt Fragmente, Kopfzeilen-Reste und doppelte Sätze (neu hinzugefügter Text wird schon beim Hinzufügen gesäubert). Dazu Statistik, Inhalt ein-/ausblenden und TXT-Export; dauerhaft im Browser gespeichert.")],["Oszilloskop",q("Satzrhythmus-Werkzeug in zwei Teilen. (1) Messen: ein Text (letzte Generierung oder Fremdtext wie Kleist/Kafka) wird zu einer Kurve analysiert — Streuung σ, lexikalische Vielfalt, Wiederholungs- und Interpunktionsdichte. (2) Rhythmus-Transplantation: eine Satzlängen-Kurve (aus dem Text abgelesen oder als Muster gewählt) steuert die Generierung — fremder Atem, eigenes Vokabular aus der aktiven ",Ee("Wortbank","tabs"),". Kurven lassen sich speichern und laden.")],["Schatzkammer",q("Kuratiertes Archiv der ",Ee("gemerkten Texte","aktionen"),". Oben eine Übersicht (Textzahl, Wörter, Ø pro Text) mit anklickbaren Form-Filtern (Prosa, Vers, Szene/Dialog, Werkstatt); jeder Eintrag zeigt Form, Wortzahl, Datum und Kontext. Ansehen, Vorlesen, ins Studio laden, einzeln löschen, alle als TXT exportieren oder die ganze Kammer leeren (Korpus und Pools bleiben). Der ",s("b",{},"Tresor")," verbirgt einzelne Texte: per Schloss-Knopf markieren; sie verschwinden aus Liste und Übersicht und werden erst sichtbar, wenn im unbeschrifteten Feld „#g“ eingegeben wird (das ✕ verbirgt sie wieder, ebenso ein Tab-Wechsel). Hinweis: Das ist eine Sicht-Verbergung, keine Verschlüsselung.")],["Montage",q("Fragmente sammeln (aus der Schatzkammer, dem letzten Studio-Text oder frei eingefügt) und nach einem Meta-Bogen zusammensetzen: Mosaik, Jahreszeiten, Divergenz und Kaleidoskop (offline) sowie Emergenz und Hyperlink als KI-Weberei (API-Schlüssel nötig). Reihenfolge per ↑/↓ ändern, Ergebnis kopieren oder in die Schatzkammer merken.")],["Werkstatt",q("Aus einem Rohtext (Studio, Schatzkammer oder eingefügt) wird in drei Stufen eine Kurzgeschichte: 1 Gerüst (Figur, Wunsch, Hindernis, Wendung, Schluss, Szenenschritte — vor dem Schreiben korrigierbar), 2 Rohfassung auf 1/1½/2 Seiten, 3 Politur. Wortbank-Motive und lebendige Pools gehen als editierbare Stilanker mit ein; Projekte sind benennbar und speicherbar. Braucht einen API-Schlüssel.")],["Diagnose",q("Selbsttest: prüft per Knopfdruck, ob jedes eingebaute Feature im Ergebnis nachweisbar ",s("b",{},"wirkt")," — kein Qualitätsurteil, nur die Frage, ob der Schalter etwas bewirkt. Je Feature eine Ampel-Kachel (greift · greift sporadisch · greift nicht · nicht prüfbar) und darunter eine Pulsreihe: ein Punkt je Testlauf, leuchtend wenn das Feature gewirkt hat. So erscheinen absichtlich seltene Features (z. B. der ",Ee("Disruptor","werkzeug"),") als gepunkteter Streifen statt als Fehler. Fehlende Voraussetzungen (leerer Korpus, kein 2.0-Preset) werden grau übersprungen. Rot heißt zuerst „nachprüfen“, nicht schon „kaputt“.")],["Hilfe",q("Diese Seite: ",Ee("Architektur-Übersicht","arch")," sowie Erklärungen zu allen Bedienelementen und Tabs, dazu ",Ee("Hinweise & Haftungsausschluss","disclaimer"),". Oben rechts die Versionsnummer.")]])),n.append(yn("kontext","Kontextzeile (Wo / Wann / Wer / Was)",[["Wo? / Wann? / Wer? / Was passiert?",q('die vier Grundangaben, aus denen jede Story gebaut wird. Frei tippen. Bei "Wer?" ergeben mehrere durch Komma getrennte Namen einen Dialog (reihum); eine Beschreibung mit Relativsatz zählt als eine Person. Feinsteuerung: ',Ee("Stärke der 4W","staerke"),".")],["Kontext würfeln",q("füllt Wo/Wann/Wer/Was zufällig aus den Kontext-Pools.")],["Kontext merken",q("aktivierbarer Schalter: sichert die aktuellen vier Felder und lädt sie bei jedem Start wieder. Erneut klicken schaltet aus und löscht den gespeicherten Kontext.")],["Automatische Anpassung",q("frei getippte Angaben werden grammatisch in die Satzform gebracht: „Hafen“ → „im Hafen“, „eine Insel“ → „auf einer Insel“, „Winter“ → „im Winter“, „Dienstag“ → „an einem Dienstag“, „müde Wächterin“ → „eine müde Wächterin“. Bereits fertige Angaben und Eigennamen bleiben unangetastet; bei unsicherem Fall greift die Anpassung bewusst nicht.")],["Hinweis unter dem Feld",q("zeigt live die eingesetzte Form („→ im Hafen“). Bei „Was passiert?“ steht dort stattdessen, welche Satzrolle die Angabe bekommt: eigener Satz, Handlung mit Verb, Vorhaben oder Ereignis-Phrase.")],["Farbcode im Feld",q("der Feldhintergrund bewertet die Eingabe von Rot bis Grün — grün: sicher einsetzbar, gelbgrün: wird automatisch angepasst, gelb: brauchbar, orange/rot: kann nicht sicher eingesetzt werden (hier drohen Grammatikbrüche im Text). Leere Felder bleiben neutral.")]])),n.append(yn("staerke","Stärke der 4W (nur Prosa, experimentell)",[["Wo / Wann / Wer / Was",q("je ein kleiner Regler direkt unter jedem ",Ee("4W-Feld","kontext"),", nur bei Form Prosa sichtbar. Reines Hochregeln: je höher ein Regler, desto mehr Sätze über diese Dimension werden eingewoben (mehr Ort-Atmosphäre, mehr Zeit-Rahmung, mehr über die Figur oder mehr Handlung). Standard 0 = neutral. Die Gesamtlänge bleibt über den Textlängen-Regler stabil; die Gewichtung verschiebt die Verteilung. Wirkt in Echtzeit.")]])),n.append(yn("presetton","Preset · Ton · Form",[["Preset",q("die aktive ",Ee("Wortbank","tabs")," als Ankreuz-Liste: ",s("b",{},"ein")," Häkchen lädt dieses Preset, ",s("b",{},"mehrere")," Häkchen vereinen ihre Wortbänke zu einem Mix. Beim Start zufällig gewählt; die Auswahl bleibt über den Neustart erhalten und lässt sich per Schloss beim Würfeln festhalten.")],["Auto-Mix würfeln",q("würfelt pro Kategorie ein zufälliges Preset zusammen. Die benutzten Quell-Presets werden in der Liste schattiert und mit Zähler markiert — der Tooltip nennt die Kategorien, die sie beigesteuert haben.")],["Ton",q("färbt den Text ein (Einleitung + verteilte Einschübe). Neutral fügt nichts hinzu. Sichtbar gemacht in der ",Ee("Einspeisungs-Färbung","faerben"),".")],["Form",q("Textformat: Prosa (ein Erzähler berichtet), Prosagedicht, Gedicht-Strang, Reim, Haiku, Szene/Dialog (Bühnentext mit Sprecherzeilen und Regieanweisungen), Multi-Shot (Video). Merksatz: Prosa erzählt, Szene/Dialog zeigt. Zeilen-/Versformen werden von der Ton-Einfärbung ausgenommen.")]])),n.append(yn("werkzeug","Werkzeugkasten (aufklappbar)",[["Schrift · Größe",q("Schriftart (Serif/Times/Sans/Mono) und Größe der Ausgabe; wird lokal gemerkt.")],["Struktur",q("Erzählform: Auto (zufällig), Linear, Reverse, Kreis, Fragment, Objekt, Dramaturgie (",Ee("Preset 2.0","preset2")," — baut den Text entlang des Erzählbogens), Rekombination.")],["Rekombination (nur Prosa)",q("experimenteller Bauweg: Statt Sätze in Schablonen zu füllen, setzt die Engine den Text aus ",s("b",{},"geprüften Bausteinen")," zusammen. Jeder Baustein trägt eine Schnittstelle — Satztyp, Fall, Zeitform, ob er einen Doppelpunkt bedienen kann —, und nur passende Kombinationen werden zugelassen. Die Positionen folgen einem Bogen (Eröffnung, Verdichtung, Umschlag, Schluss); Varianz und Instabilität steuern, wie harte Brüche zugelassen werden. Erzeugt weniger Grammatikfehler, ist dafür karger als die Schablonen.")],["Modus",q("Realitätsmodus (z. B. bürokratisch, technologisch, mythisch, absurd …).")],["Perspektive",q("Ich-, Du- oder Er/Sie-Erzähler; Verben werden passend konjugiert.")],["Rhythmus · Disruptor · Instabilität",q("steuern Satzlängen-Variation, gezielte Brüche und die Figuren-Instabilität.")],["Figurendisziplin",q("wie streng die ",Ee("Bestenauslese","ranking")," Fassungen abwertet, die neue Eigennamen einführen stat + (Schriftgröße), Kopieren, Merken, Vorlesen.")],["Vorlesen",q("liest den Text per Browser-Sprachausgabe auf Deutsch vor (offline).")],["Textlänge",q("Ziel-Wortzahl (40–300): steuert bei Prosa das Kürzen/Auffüllen, bei Szene/Dialog die Rundenzahl.")]])),n.append(yn("faerben","Editieren — Färben & Passagen-Austausch (im Studio)",[["Editieren",q("Schalter unter der Ausgabe (früher „Einspeisungen färben“): macht den Text bearbeitbar und färbt jede Passage nach Herkunft — ",Ee("Wortbank","presetton"),", ",Ee("Ton","presetton"),", ",Ee("4W-Kontext","kontext"),", Lebendige Pools, ",Ee("Markov","werkzeug"),"; unmarkiert = feste Vorlagen. Die Legende daneben zeigt die Farbzuordnung.")],["Passagen-Austausch",q("Bei aktivem Editieren sind alle Passagen anklickbar — farbige wie unmarkierte. Ein Klick öffnet ein Fenster mit Alternativen aus derselben Quelle (🎲 Neu holt weitere), dazu ✕ Entfernen, ein Freitextfeld und ein vorbefülltes Bearbeitungsfeld, um nur die Grammatik anzupassen ohne die Passage neu zu schreiben. Unmarkierte Stellen öffnen direkt das Textfeld — dort lassen sich fehlende Wörter ergänzen. Steht die Passage am Satzanfang, wird sie automatisch großgeschrieben.")],["Passende Alternativen",q("die Vorschläge werden nach inhaltlicher Nähe zum umgebenden Text sortiert — Kandidaten, die Wörter des Absatzes aufgreifen, stehen oben. „🎲 Neu“ mischt innerhalb der passendsten Vorschläge neu.")],["Bauplan (nur Rekombination)",q("Schalter neben der Legende: zeigt unter dem Text, aus welchen Bausteinen er entstanden ist — gegliedert nach Erzählphase (Eröffnung, Verdichtung, Umschlag, Schluss) und mit der Herkunft jedes Teils (Motiv, Haken, Requisite, Wendung, Hindernis, Einsatz, Ende oder Fügeteil). Eingerückte Zeilen zeigen, was in eine Leerstelle eingesetzt wurde. Macht den Bogen sichtbar und deckt auf, wenn ein Baustein an der falschen Stelle landet.")],["↩ Rückgängig",q("Chip rechts in der Legende (oder Strg/Cmd+Z) nimmt die letzten Änderungen am Text zurück — bis zu zwö
