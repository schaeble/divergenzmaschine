er:["Von der ersten Sekunde an fühlte sich hier nichts richtig an.","Es begann leise - so, wie das Schlimmste meistens beginnt.","Manche Orte warten nur darauf, dass jemand kommt.","Es gibt keinen Ausweg, nur die Illusion davon.","Was folgte, hätte niemand aufhalten können.","Die Dunkelheit hier ist älter als das Haus, das sie birgt."],flavor:["Nichts daran fühlt sich je wirklich sicher an.","Etwas darin roch unverkennbar nach Verlust.","Die Kälte bleibt, auch wenn längst niemand mehr hinsieht.","Es ist die Art von Stille, die etwas Schlimmeres ankündigt.","Irgendwo darunter wartete bereits das nächste Unglück.","Kein Trost weit und breit - nur die Gewissheit, dass es schlimmer werden würde.","Jeder Ausweg führt nur tiefer hinein.","Etwas beobachtete, ohne je gesehen zu werden.","Die Hoffnung ist das Erste, was hier stirbt.","Man spürt, dass die Wände zuhören.","Es ist zu spät, schon bevor es beginnt.","Selbst das Schweigen hat hier Zähne."]},unheimlich:{opener:["Alles wirkt vertraut, und genau das ist das Problem.","Irgendetwas ist anders, aber man kann nicht sagen, was.","Die Dinge stehen zu still, um natürlich zu sein.","Es ist, als hätte jemand die Welt fast, aber nicht ganz richtig nachgebaut.","Man hat das Gefühl, nicht allein zu sein - ohne Beweis dafür.","Etwas stimmt mit den Schatten nicht."],flavor:["Die Spiegel scheinen einen Sekundenbruchteil zu spät zu reagieren.","Ein Geräusch, das nur existiert, wenn man nicht hinhört.","Die Gesichter sind richtig, nur das Lächeln sitzt falsch.","Etwas zählt mit, jedes Mal, wenn man die Tür schließt.","Die Uhr geht, aber die Zeit steht.","Man erkennt den Raum wieder, ohne je dort gewesen zu sein.","Die Stille hat eine Form, und sie kommt näher.","Irgendwo atmet etwas im Takt der eigenen Schritte.","Ein Detail ist zu viel im Bild, und keiner sieht es an.","Es fühlt sich an, als würde man erwartet."]},uplifting:{opener:["Und doch beginnt hier, allen Umständen zum Trotz, etwas Gutes.","Selbst an diesem Ort lässt sich noch Hoffnung finden.","Manchmal reicht ein einziger Moment, um alles zu wenden.","Es sieht aussichtslos aus - und ist es dann doch nicht.","Irgendwo darin liegt der Anfang von etwas Besserem.","Gerade wenn alles verloren scheint, kommt das Licht zurück."],flavor:["Und doch bleibt, gegen jede Erwartung, ein Rest Hoffnung.","Irgendetwas darin fühlte sich nach einem echten Neuanfang an.","Es ist, als würde sich gerade, ganz leise, etwas zum Guten wenden.","Ein kleiner Trost bleibt trotzdem - und manchmal reicht genau das.","Selbst im Schwierigsten findet sich noch ein Grund zum Weitermachen.","Am Ende zählt nicht der Verlust, sondern das, was bleibt.","Eine unerwartete Freundlichkeit veränderte alles.","Zum ersten Mal seit Langem scheint der Weg wieder offen.","Es ist schwer, aber es lohnt sich.","Manchmal ist der Sturz nur der Anlauf.","Etwas darin richtet sich wieder auf.","Und plötzlich scheint alles möglich."]},zaertlich:{opener:["Es geschieht mit einer Behutsamkeit, die man kaum erwarten würde.","Manche Dinge muss man leise erzählen, sonst zerbrechen sie.","Es ist klein und warm und leicht zu übersehen.","Zwischen ihnen liegt eine Sanftheit, für die es kein Wort gibt.","Es beginnt mit einer Geste, die niemand sonst bemerkt.","Alles daran ist sacht, fast wie Atem im Schlaf."],flavor:["Eine Hand, die blieb, obwohl sie gehen durfte.","Es ist die Sorte Nähe, die keine Worte braucht.","Etwas darin passt auf einen auf, ganz unaufdringlich.","Ein Lächeln, so leise, dass man es fast überhört.","Die Welt wird für einen Moment weicher.","Es ist ein kleines Zärtlichsein, mitten im Lärm.","Jemand hält etwas Zerbrechliches, ohne es zu drücken.","Wärme, die keine Gegenleistung will.","Es fühlt sich an wie Ankommen.","Ein Trost, der einfach nur dablieb."]},traeumerisch:{opener:["Es ist schwer zu sagen, ob es geschieht oder nur geträumt wird.","Die Ränder der Dinge sind an diesem Tag nicht ganz fest.","Alles treibt ein wenig, wie Boote ohne Anker.","Es fühlt sich an, als wäre man mitten in einem fremden Traum aufgewacht.","Die Logik hat hier Urlaub genommen.","Zeit und Ort sind nur Vorschläge."],flavor:["Die Dinge verwandeln sich, kaum dass man wegsieht.","Ein Zimmer wird zum Meer, ohne dass es jemand stört.","Die Schwerkraft scheint Verhandlungssache zu sein.","Man geht durch Türen, die es vorher nicht gegeben hat.","Farben riechen, und Geräusche haben Gewicht.","Alles ergab Sinn, solange man nicht genauer hinsah.","Die Erinnerung läuft der Gegenwart voraus.","Ein Gedanke wird Landschaft.","Nichts steht fest, und nichts fällt.","Es ist schön und ungereimt wie ein Traum kurz vor dem Erwachen."]},nuechtern:{opener:["Der Reihe nach: Es geschah genau so, wie es hier steht.","Ohne Umschweife - das ist, was passierte.","Es gibt daran nichts zu beschönigen.","Die Fakten sind übersichtlich, die Folgen weniger.","Man muss es nicht ausschmücken, es genügt so.","Kurz und ohne Pathos: So liegt der Fall."],flavor:["Mehr ist dazu nicht zu sagen.","Die Sache hat eine klare Ursache und eine klare Folge.","Es hilft nichts, es zu beschönigen.","Alles Weitere ergab sich daraus von selbst.","Nüchtern betrachtet, bleibt wenig Raum für Zweifel.","Die Lage ist, was sie ist.","Man notiert es und geht weiter.","Kein Drama, nur der nächste Schritt.","So einfach, so unausweichlich.","Am Ende zählen nur die Zahlen."]},ironisch:{opener:["Natürlich läuft alles nach Plan - nur nicht nach diesem.","Man ahnt schon, wie gut das ausgehen wird.","Es ist, mit Verlaub, eine glänzende Idee. Fast.","Was hätte dabei schon schiefgehen können.","Wie schön, dass wenigstens einer den Überblick behielt. Behauptete er.","Der Plan ist wasserdicht. Das Wasser findet trotzdem einen Weg."],flavor:["Es läuft exakt so gut, wie zu erwarten ist.","Ein voller Erfolg, wenn man die Ziele nachträglich anpasst.","Zum Glück ist ja jemand zuständig - nur nicht anwesend.","Die Ironie daran entging allen Beteiligten.","Man nannte es Strategie, um nicht Zufall sagen zu müssen.","Selbstverständlich hat niemand etwas geahnt. Angeblich.","Ein Meisterwerk der Planung, rückwärts betrachtet.","Alles unter Kontrolle, versichert die Kontrolle.","Bemerkenswert, wie zuverlässig das Unwahrscheinliche eintraf.","Es hätte schlimmer kommen können. Kam es dann auch."]},humorous:{opener:["Es hätte ernst werden können - wurde es aber nicht ganz.","Manche Geschichten sind einfach zu absurd, um nicht zu grinsen.","Was folgt, ist mit Ansage albern.","Es beginnt harmlos und entgleitet dann auf komische Weise.","Man sollte das nicht so ernst nehmen. Die Beteiligten taten es auch nicht.","Vorweg: Niemand kommt ernsthaft zu Schaden, nur die Würde."],flavor:["Absurd genug, um fast schon wieder normal zu wirken.","Selbst das Schicksal scheint dabei kurz zu grinsen.","Niemand würde sich das so ausdenken - und genau deshalb ist es lustig.","Es hat, aller Dramatik zum Trotz, etwas unfreiwillig Komisches.","Man bräuchte fast Popcorn, so albern läuft das gerade.","Selbst die Beteiligten müssen sich das Lachen verkneifen.","Es ist ein Chaos, aber ein gut gelauntes.","Die Peinlichkeit ist beeindruckend gleichmütig.","Am Ende lachen alle - manche sogar freiwillig.","Der Ernst der Lage hat sichtlich Feierabend."]}},uu={neutral:{},mystery:{rhythm:"long"},poetic:{rhythm:"breath",register:"lyrical"},melancholisch:{rhythm:"long",register:"lyrical"},dark:{rhythm:"fracture",register:"dark"},unheimlich:{rhythm:"fracture",register:"dark"},uplifting:{rhythm:"clean"},zaertlich:{rhythm:"breath",register:"lyrical"},traeumerisch:{rhythm:"breath",register:"lyrical"},nuechtern:{rhythm:"clean",register:"plain"},ironisch:{rhythm:"clean",register:"wry"},humorous:{rhythm:"staccato",register:"wry"}};function hk(e){return e?uu[e]?.rhythm:void 0}function dk(e){return e&&uu[e]?.register||null}const Dc=e=>e&&e[0].toUpperCase()+e.slice(1);function uk(e,t){const n=dk(t);if(!n||!e)return e;if(n==="plain"){let i=e.replace(/\b(gleichsam|wie Honig im Winter|wie ein halb vergessenes Gedicht[^.,;]*)\b/gi,"").replace(/\s{2,}/g," "); x="770.5" y="573" text-anchor="middle" font-size="12.5" fill="#414b5a">Mosaik · Jahreszeit · Divergenz · Kaleidoskop</text><text x="770.5" y="590" text-anchor="middle" font-size="12.5" fill="#414b5a">Emergenz · Hyperlink (KI-Weberei)</text><rect x="970.0" y="540" width="32" height="19" rx="9.5" fill="#f4c250" stroke="#d7a531"/><text x="986.0" y="553.5" text-anchor="middle" font-size="11" font-weight="700" fill="#4a3600">KI</text><text x="520.0" y="634" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5262">Montage → Werkstatt</text><rect x="420.0" y="646" width="200" height="46" rx="12" fill="#ffffff" stroke="#33a894" stroke-width="1.6"/><text x="520.0" y="675" text-anchor="middle" font-size="16" font-weight="700" fill="#1d2430">★ Merken</text><line x1="510.5" y1="616" x2="510.5" y2="638" stroke="#59616f" stroke-width="2"/><path d="M505.5,637 L510.5,646 L515.5,637 Z" fill="#59616f"/><path d="M420.0,669.0 H14 V116 H24" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 5"/><path d="M25,111 L15,116 L25,121 Z" fill="#2f9e44"/></svg>';function Ft(e,t,n){const i=s("ul",{class:"help-list"});return n.forEach(([r,a])=>{const l=s("li",{},s("b",{},r)," — ");a.forEach(o=>l.append(o)),i.append(l)}),s("div",{class:"help-sec",id:"help-"+e},s("h3",{},t),i)}function He(e,t){const n=s("a",{class:"help-jump",href:"#help-"+t},e);return n.addEventListener("click",i=>{i.preventDefault();const r=document.getElementById("help-"+t);r&&(r.scrollIntoView({behavior:"smooth",block:"start"}),r.classList.remove("help-flash"),r.offsetWidth,r.classList.add("help-flash"))}),n}const me=(...e)=>e;function u0(e){e.innerHTML="";const t=s("div",{class:"help"});t.append(s("p",{class:"muted"},`Divergenzmaschine v${Uh} — was die Bedienelemente tun. Blaue Verweise springen zum passenden Abschnitt.`));const n=s("div",{class:"help-arch help-sec",id:"help-arch"});n.append(s("h3",{},"Architektur — wie ein Text entsteht"));const i=s("div",{class:"help-arch-fig"});i.innerHTML=d0,n.append(i),n.append(s("p",{class:"muted"},"Der grüne Kreislauf: gemerkte Texte füttern Korpus und Pools zurück (Selbstfütterung). KI-Bausteine (Werkstatt, Montage) brauchen einen API-Schlüssel.")),t.append(n),t.append(Ft("tabs","Tabs — die App im Überblick",[["Studio",me("Die Hauptbühne: aus ",He("4W-Kontext","kontext"),", ",He("Preset, Ton und Form","presetton")," entstehen die Texte. Alle ",He("Stil-Regler","werkzeug")," (Struktur, Modus, Perspektive, Rhythmus, Markov, Archetyp, Instabilität …), die ",He("Aktionen","aktionen")," Generieren/Variante/Würfeln/Merken/Tresor, das ",He("Editieren mit Passagen-Austausch","faerben")," sowie ",He("Test & Ranking","ranking"),". Eine neue Variante gibt es auch per Pfeil links/rechts im Textfenster oder per Wischen auf dem Handy.")],["Ideen",me("Prämissen-Generator: zehn Profil-Merkmale (Genre, Figurtyp, Ort, Zeit …) formen die Richtung kurzer Story-Ideen. Preset wählen, Regler selbst stellen oder per KI aus einem Thema ein Profil bauen; der Divergenz-Regler steuert die Streuung (zahm → radikal). „→ Studio“ übernimmt eine Prämisse als ",He("4W-Kontext","kontext"),". Eigene Profile als Preset speicherbar.")],["Meldung (kurz)",me("Die Kurzmeldung, 25–70 Wörter: ",s("b",{},"alle vier W im ersten Satz"),", höchstens vier Sätze, ein Ereignis, ein Tempus, keine Wertung. Sie ist die einzige Form, die NICHT aus der Wortbank erzählt, sondern ausschließlich aus dem Faktenblatt referiert — ein literarischer Einschub wäre in einer Meldung genau der Fehler, den sie ausschließt. Das Ressort steuert Rollen und Einheiten wie beim ",He("Bericht","tabs"),"; der Ton bestimmt die Blickrichtung (Gewinn oder Verlust). Im ",s("b",{},"Zeitungssetzer")," geht sie automatisch in den Kasten und setzt unter „Kurz gemeldet“ — das kurze Format, das dem Blatt bisher fehlte. Der Längenregler verschiebt nur, wie viele Folgesätze mitkommen: Eine Meldung auf 300 Wörter wäre keine Meldung mehr.")],["Sammler",me("Holt aus der deutschen Wikipedia den Tagesfeed eines zufälligen Tages aus dem zurückliegenden Jahr — ",s("b",{},"Artikel des Tages"),", ",s("b",{},"Was geschah am …")," und ",s("b",{},"In den Nachrichten")," — und zerlegt jeden Fund in ",He("Wo / Wann / Wer / Was","kontext"),". Personen und Orte werden aus den Strukturdaten des Feeds bestimmt (Koordinaten, Kurzbeschreibung), nicht aus der Großschreibung geraten; was nicht sicher bestimmbar ist, bleibt leer und lässt beim Übernehmen den bisherigen Studio-Wert stehen. Quellen einzeln abschaltbar. Jeder geholte Tag wandert in den ",s("b",{},"Vorrat")," (bis 300 Funde, danach fällt der älteste heraus); er liegt im Browser und wandert mit ",He("Exportieren","sichern")," in die Projektdatei. Die Taste ",s("b",{},"Wiki")," im Studio — neben „Kontext würfeln“ — zieht daraus einen zufälligen Fund und füllt die vier Felder, ",s("b",{},"ohne Netz"),". Der Reiter selbst ist der einzige Teil der Maschine, der ohne API-Schlüssel ins Netz greift: Abgerufen wird nur der öffentliche Tagesfeed, gesendet wird nichts.")],["Welt",me("Omnikognition (Wahrnehmungs-Modus): aus dem Profil eines Lebewesens (Sinne, Zeitgefühl, Selbstmodell, soziale Kognition … zehn Kriterien) werden ",He("Perspektive, Rhythmus","werkzeug")," und Bildwelt geformt und ins Studio übertragen. Preset wählen, Kriterien selbst stellen oder per „KI-Profil erzeugen“ aus einem Namen bauen; eigene Profile als Preset speichern.")],["Wortbank",me("Das Material-Herz: Presets laden, Auto-Mix, Regeln-Box (wie Einträge zu schreiben sind), „Preset bearbeiten und sichern“ als Editor aller 7 Kategorien (mit Präteritum-Warnung je Kategorie und dem Offline-Knopf „Präteritum → Präsens“, der eindeutige Formen umschreibt und unsichere stehen lässt) (Motive, Haken, Requisiten, Wendungen, Hindernisse, Einsätze, Schlüsse), Mutation, Preset-Assistent und Wortarchiv (KI oder Einfügen, in Gruppen), JSON-Import/Export, „Als Preset speichern“ (schlägt den aktiven Namen vor), „Preset umbenennen“ und „Preset löschen“ für eigene Presets. „Mehrere Presets per KI aktualisieren“ verbessert Presets im Stapel; die ",He("Preset-2.0-Felder","preset2")," ergänzen den dramaturgischen Überbau. Unten aufklappbar die KI-Wortbank aus 4W plus Zusatzvorgabe.")],["Korpus",me("Eigener Trainingstext für den ",He("Markov-Generator","werkzeug"),". Der Schalter ",s("b",{},"Selbstfütterung")," nimmt zusätzlich den Siegertext jeder Generierung mit ",He("Bestenauslese","ranking")," auf — ohne ihn wächst der Korpus nur über „Merken“ und Handeingabe, und ein leerer Korpus bedeutet: der Markov-Regler bewirkt nichts. Die Maschine lernt dann auch aus ihren eigenen Texten; das schärft den Ton, kann aber Wendungen verfestigen, deshalb gelegentlich säubern. Vorgabe: aus. „Säubern“ segmentiert satzweise und entfernt Fragmente, Kopfzeilen-Reste und doppelte Sätze (neu hinzugefügter Text wird schon beim Hinzufügen gesäubert). Dazu Statistik, Inhalt ein-/ausblenden und TXT-Export; dauerhaft im Browser gespeichert.")],["Oszilloskop",me("Satzrhythmus-Werkzeug in zwei Teilen. (1) Messen: ein Text (letzte Generierung oder Fremdtext wie Kleist/Kafka) wird zu einer Kurve analysiert — Streuung σ, lexikalische Vielfalt, Wiederholungs- und Interpunktionsdichte. (2) Rhythmus-Transplantation: eine Satzlängen-Kurve (aus dem Text abgelesen oder als Muster gewählt) steuert die Generierung — fremder Atem, eigenes Vokabular aus der aktiven ",He("Wortbank","tabs"),". Kurven lassen sich speichern und laden.")],["Schatzkammer",me("Kuratiertes Archiv der ",He("gemerkten Texte","aktionen"),". Oben eine Übersicht (Textzahl, Wörter, Ø pro Text) mit anklickbaren Form-Filtern (Prosa, Vers, Szene/Dialog, Werkstatt); jeder Eintrag zeigt Form, Wortzahl, Datum und Kontext. Ansehen, Vorlesen, ins Studio laden, einzeln löschen, alle als TXT exportieren oder die ganze Kammer leeren (Korpus und Pools bleiben). Der ",s("b",{},"Tresor")," verbirgt einzelne Texte: per Schloss-Knopf markieren; sie verschwinden aus Liste und Übersicht und werden erst sichtbar, wenn im unbeschrifteten Feld „#g“ eingegeben wird (das ✕ verbirgt sie wieder, ebenso ein Tab-Wechsel). Hinweis: Das ist eine Sicht-Verbergung, keine Verschlüsselung.")],["Montage",me("Fragmente sammeln (aus der Schatzkammer, dem letzten Studio-Text oder frei eingefügt) und nach einem Meta-Bogen zusammensetzen: Mosaik, Jahreszeiten, Divergenz und Kaleidoskop (offline) sowie Emergenz und Hyperlink als KI-Weberei (API-Schlüssel nötig). Reihenfolge per ↑/↓ ändern, Ergebnis kopieren oder in die Schatzkammer merken.")],["Werkstatt",me("Aus einem Rohtext (Studio, Schatzkammer oder eingefügt) wird in drei Stufen eine Kurzgeschichte: 1 Gerüst (Figur, Wunsch, Hindernis, Wendung, Schluss, Szenenschritte — vor dem Schreiben korrigierbar), 2 Rohfassung auf 1/1½/2 Seiten, 3 Politur. Wortbank-Motive und lebendige Pools gehen als editierbare Stilanker mit ein; Projekte sind benennbar und speicherbar. Braucht einen API-Schlüssel.")],["Diagnose",me("Selbsttest: prüft per Knopfdruck, ob jedes eingebaute Feature im Ergebnis nachweisbar ",s("b",{},"wirkt")," — kein Qualitätsurteil, nur die Frage, ob der Schalter etwas bewirkt. Je Feature eine Ampel-Kachel (greift · greift sporadisch · greift nicht · nicht prüfbar) und darunter eine Pulsreihe: ein Punkt je Testlauf, leuchtend wenn das Feature gewirkt hat. So erscheinen absichtlich seltene Features (z. B. der ",He("Disruptor","werkzeug"),") als gepunkteter Streifen statt als Fehler. Fehlende Voraussetzungen (leerer Korpus, kein 2.0-Preset) werden grau übersprungen. Rot heißt zuerst „nachprüfen“, nicht schon „kaputt“. Darunter der ",s("b",{},"Wirkungsmesser"),": Er fährt jeden Regler einzeln durch alle Stellungen, hält alles andere fest und misst je N Texte mit den vorhandenen Maßen. Der Wert ist der Ausschlag im Verhältnis zum Rauschen — die Spanne zwischen den Stellungen, geteilt durch die Streuung innerhalb einer Stellung. Unter 1 bewegt ein Regler weniger als der Zufall zwischen zwei Läufen derselben Einstellung. Die ",s("b",{},"Blindprobe")," ist ein Regler, der nichts ändert; sie muss unter 1 bleiben, sonst trägt die Messung nicht. Ein Optimum errechnet das Blatt bewusst nicht: Die Maße widersprechen einander, und was gut ist, entscheidet der Leser.")],["Hilfe",me("Diese Seite: ",He("Architektur-Übersicht","arch")," sowie Erklärungen zu allen Bedienelementen und Tabs, dazu ",He("Hinweise & Haftungsausschluss","disclaimer"),". Oben rechts die Versionsnummer.")]])),t.append(Ft("kontext","Kontextzeile (Wo / Wann / Wer / Was)",[["Wo? / Wann? / Wer? / Was passiert?",me('die vier Grundangaben, aus denen jede Story gebaut wird. Frei tippen. Bei "Wer?" ergeben mehrere durch Komma getrennte Namen einen Dialog (reihum); eine Beschreibung mit Relativsatz zählt als eine Person. Feinsteuerung: ',He("Stärke der 4W","staerke"),".")],["Kontext würfeln",me("füllt Wo/Wann/Wer/Was zufällig aus den Kontext-Pools.")],["Kontext merken",me("aktivierbarer Schalter: sichert die aktuellen vier Felder und lädt sie bei jedem Start wieder. Erneut klicken schaltet aus und löscht den gespeicherten Kontext.")],["Automatische Anpassung",me("frei getippte Angaben werden grammatisch in die Satzform gebracht: „Hafen“ → „im Hafen“, „eine Insel“ → „auf einer Insel“, „Winter“ → „im Winter“, „Dienstag“ → „an einem Dienstag“, „müde Wächterin“ → „eine müde Wächterin“. Bereits fertige Angaben und Eigennamen bleiben unangetastet; bei unsicherem Fall greift die Anpassung bewusst nicht.")],["Hinweis unter dem Feld",me("zeigt live die eingesetzte Form („→ im Hafen“). Bei „Was passiert?“ steht dort stattdessen, welche Satzrolle die Angabe bekommt: eigener Satz, Handlung mit Verb, Vorhaben oder Ereignis-Phrase.")],["Farbcode im Feld",me("der Feldhintergrund bewertet die Eingabe von Rot bis Grün — grün: sicher einsetzbar, gelbgrün: wird automatisch angepasst, gelb: brauchbar, orange/rot: kann nicht sicher eingesetzt werden (hier drohen Grammatikbrüche im Text). Leere Felder bleiben neutral.")]])),t.append(Ft("staerke","Stärke der 4W (nur Prosa, experimentell)",[["Wo / Wann / Wer / Was",me("je ein kleiner Regler direkt unter jedem ",He("4W-Feld","kontext"),", nur bei Form Prosa sichtbar. Reines Hochregeln: je höher ein Regler, desto mehr Sätze über diese Dimension werden eingewoben (mehr Ort-Atmosphäre, mehr Zeit-Rahmung, mehr über die Figur oder mehr Handlung). Standard 0 = neutral. Die Gesamtlänge bleibt über den Textlängen-Regler stabil; die Gewichtung verschiebt die Verteilung. Wirkt in Echtzeit.")]])),t.append(Ft("presetton","Preset · Ton · Form",[["Preset",me("die aktive ",He("Wortbank","tabs")," als Ankreuz-Liste: ",s("b",{},"ein")," Häkchen lädt dieses Preset, ",s("b",{},"mehrere")," Häkchen vereinen ihre Wortbänke zu einem Mix. Beim Start zufällig gewählt; die Auswahl bleibt über den Neustart erhalten und lässt sich per Schloss beim Würfeln festhalten.")],["Auto-Mix würfeln",me("würfelt pro Kategorie ein zufälliges Preset zusammen. Die benutzten Quell-Presets werden in der Liste schattiert und mit Zähler markiert — der Tooltip nennt die Kategorien, die sie beigesteuert haben.")],["Ton",me("färbt den Text ein (Einleitung + verteilte Einschübe). Neutral fügt nichts hinzu. Sichtbar gemacht in der ",He("Einspeisungs-Färbung","faerben"),".")],["Form",me("Textformat: Prosa (ein Erzähler berichtet), Prosagedicht, Gedicht-Strang, Reim, Haiku, Szene/Dialog (Bühnentext mit Sprecherzeilen und Regieanweisungen), Multi-Shot (Video). Merksatz: Prosa erzählt, Szene/Dialog zeigt. Zeilen-/Versformen werden von der Ton-Einfärbung ausgenommen.")]])),t.append(Ft("werkzeug","Werkzeugkasten (aufklappbar)",[["Schrift · Größe",me("Schriftart (Serif/Times/Sans/Mono) und Größe der Ausgabe; wird lokal gemerkt.")],["Struktur",me("Erzählform: Auto (zufällig), Linear, Reverse, Kreis, Fragment, Objekt, Dramaturgie (",He("Preset 2.0","preset2")," — baut den Text entlang des Erzählbogens), Rekombination.")],["Rekombination (Vorauswahl, nur Prosa)",me("Der Standardweg: Statt Sätze in Schablonen zu füllen, setzt die Engine den Text aus ",s("b",{},"geprüften Bausteinen")," zusammen. Jeder Baustein trägt eine Schnittstelle — Satztyp, Fall, Zeitform, ob er einen Doppelpunkt bedienen kann —, und nur passende Kombinationen werden zugelassen. Die Positionen folgen einem Bogen (Eröffnung, Verdichtung, Umschlag, Schluss); Varianz und Instabilität steuern, wie harte Brüche zugelassen werden. Im Vergleich über alle 51 Presets liegt die Phrasenwiederholung zehnmal niedriger als bei den Schablonen (0,011 gegen 0,10 bis 0,13), Tempus- und Perspektivbrüche sind die niedrigsten im Feld. Der Preis ist die Länge: rund 86 statt 96 Prozent der Vorgabe, weil der Vorrat eines Presets endlich ist — der Hinweis unter dem Text sagt es, wenn er nicht reicht.")],["Modus",me("Realitätsmodus (z. B. bürokratisch, technologisch, mythisch, absurd …).")],["Perspektive",me("Ich-, Du- oder Er/Sie-Erzähler; Verben werden passend konjugiert.")],["Rhythmus · Disruptor · Instabilität",me("steuern Satzlängen-Variation, gezielte Brüche und die Figuren-Instabilität.")],["Figurendisziplin",me("wie streng die ",He("Bestenauslese","ranking")," Fassungen abwertet, die neue Eigennamen einführen statt die vorhandenen Figuren weiterzuführen. „Offen“ lässt die Streuung zu (gewollte Divergenz), „Streng“ hält den Text auf den in „Wer?“ genannten Figuren. Wirkt nur bei aktiver Bestenauslese.")],["Spannung (nur Prosa)",me("verschiebt den Spannungs-Höhepunkt in den Text: Oben (12 Uhr), Mitte (3 Uhr) oder Unten (6 Uhr). Nahe dem Peak werden Sätze kurz und hart, Hook-/Motiv-Bilder verdichten sich und ein harter Bruch setzt ein; fern davon ruhige, verbundene Bögen — hilft gegen den Spannungsabfall in langen Texten. Wirkt erst ab längeren Passagen.")],["Markov",me("Anteil, in dem der offline gelernte ",He("Markov-Generator (Korpus)","tabs")," mitmischt.")],["Archetyp A/B",me("färbt die Sprache aus Archetyp-Wortpools (Neutral, Skorpion, Psychopath, Entdecker); Standard neutral.")],["Varianz",me("Variationsgrad bei der Generierung.")],["Umwelt",me("Begriffe, Wörter, Zahlenkombinationen oder Zeichen, die nicht den Text erzeugen, sondern die Bestenauslese richten. „Nahrung“ bevorzugt unter den zwölf Fassungen die, die sie aufnehmen, „Gift“ die, die sie meiden. Der Chip unter dem Text sagt, ob die Umwelt den Ausschlag gegeben hat oder ob dieselbe Fassung auch ohne sie gewonnen hätte — eine hohe Quote allein beweist nichts, denn was das Preset ohnehin dauernd sagt, steht auch ohne Umwelt im Text. Auf Zeichen, die im Preset gar nicht vorkommen, wirkt sie nicht: Auswahl kann nur wählen, was die Erzeugung anbietet.")],["Sprachschliff",me("kein Schalter mehr, sondern immer an: Abstände, Zeichensetzung, doppelte Wörter und ein am Satzanfang fehlender Artikel. Nur Regeln, die in jedem Text richtig sind — die Grammatik-Einzelfälle von früher sind entfallen.")],["Video: Shots / Sekunden",me("nur bei Form Multi-Shot: Anzahl der Einzelszenen und Ziel-Gesamtlänge.")]])),t.append(Ft("aktionen","Aktionen",[["Generieren",me("erzeugt aus den aktuellen Angaben und Einstellungen eine neue Story.")],["Variante",me("sofort eine weitere Zufallsvariante mit unveränderten Einstellungen.")],["Würfeln",me("würfelt alle Stil-Parameter neu (Ton, Form, Struktur, Modus, Perspektive, Rhythmus, Instabilität, Markov, Disruptor, Varianz, Stil, Preset) — lässt Wo/Wann/Wer/Was unangetastet.")],["Kopieren",me("kopiert den angezeigten Text in die Zwischenablage.")],["Merken",me("legt den Text dauerhaft in die ",He("Schatzkammer","tabs")," (bis 100 Texte) und füttert damit den Korpus. Seit 4.236.0 wandert die ",s("b",{},"Reglerstellung")," mit — Ton, Form, Struktur, Modus, Perspektive, Rhythmus, Varianz, Markov, Disruptor, Spannung, Archetypen, Instabilität, Ressort, Preset und Ziellänge. „→ Studio“ holt damit nicht nur den Text zurück, sondern die Einstellung, aus der er entstanden ist; und die Sammlung wird auswertbar: Was du behältst, ist das einzige belastbare Urteil über „gut“.")],["Tresor",me("legt den Text direkt verborgen in den Tresor der ",He("Schatzkammer","tabs")," — und füttert bewusst ",s("b",{},"weder")," Korpus noch lebendige Pools.")],["Zeitungsseite",me("setzt aus den Texten der ",He("Schatzkammer","tabs")," eine A4-Zeitungsseite: Kopf gestalten (Titel, Motto, Ausgabe, Preis, Linien, gebrochene Schrift), Beiträge als Aufmacher, Spalte oder Kasten wählen, „Seiten füllen“ verteilt automatisch über bis zu acht Seiten. ",s("b",{},"Bild einfügen")," legt ein Bild vom Gerät auf die Seite: mit der Maus verschieben, am Griff unten rechts aufziehen (das Seitenverhältnis bleibt), das ✕ nimmt es wieder heraus. Die Taste ",s("b",{},"▦ Raster")," lässt das Bild auf dem Spaltenraster der Seite einrasten: Die Breite springt auf ganze Spalten, die linke Kante auf einen Spaltenanfang, die Oberkante auf ein 5-mm-Raster; die Höhe folgt dem Seitenverhältnis und wird nie gerastert. Beim Ziehen werden die Spalten sichtbar. Die Taste schaltet auf freies Ziehen um und merkt sich den Zustand. Der Text bricht am Bild ab und läuft darunter weiter: Jede berührte Spalte hält das Band des Bildes frei (mit 2 mm Luft). Nur der Aufmacher bleibt außen vor — sein Satz läuft über CSS-Spalten, dort verdeckt ein Bild weiterhin. Es wird auf 1200 px verkleinert gesichert und wandert mit ",He("Exportieren","sichern")," in die Projektdatei. ",s("b",{},"↶ Zurück")," nimmt den letzten Schritt zurück — Bild, Beitragsauswahl, Kopf, Spalten und Seitenzahl, bis zu 40 Schritte weit. ",s("b",{},"Layout speichern")," sichert den ganzen Setzer unter einem Namen (Kopf, Spalten, Seiten, Beitragsauswahl mit Rolle und Überschrift, Bilder) und holt ihn mit „Laden“ zurück; die Beiträge merken sich über ihren Text, nicht über ihre Listenposition — steht ein Text nicht mehr in der Schatzkammer, sagt die Meldung, wie viele fehlen. Bis zu 12 Layouts, sie wandern mit in die Projektdatei. ",s("b",{},"Beim Drucken"),": Datum, Seitentitel und Adresse am Blattrand sind die Kopf- und Fußzeile des BROWSERS, nicht die der Zeitung — im Druckdialog unter „Weitere Einstellungen“ abschaltbar; dann rückt der Zeitungskopf nach oben. Text, der sonst an der Fußlinie abgeschnitten würde, wird satzweise gekürzt; die Statuszeile sagt, wie oft.")],["Pfeile / Wischen",me("die Pfeile links und rechts im Textfenster erzeugen eine neue Variante; auf dem Handy genügt ein Wischen nach links oder rechts über den Text.")],["Lesen",me("Vollbild-Lesemodus mit Werkzeugleiste: A−/A+ (Schriftgröße), Kopieren, Merken, Vorlesen.")],["Vorlesen",me("liest den Text per Browser-Sprachausgabe auf Deutsch vor (offline).")],["Textlänge",me("Ziel-Wortzahl (40–300): steuert bei Prosa das Kürzen/Auffüllen, bei Szene/Dialog die Rundenzahl.")]])),t.append(Ft("faerben","Editieren — Färben & Passagen-Austausch (im Studio)",[["Editieren",me("Schalter unter der Ausgabe (früher „Einspeisungen färben“): macht den Text bearbeitbar und färbt jede Passage nach Herkunft — ",He("Wortbank","presetton"),", ",He("Ton","presetton"),", ",He("4W-Kontext","kontext"),", Lebendige Pools, ",He("Markov","werkzeug"),"; unmarkiert = feste Vorlagen. Die Legende daneben zeigt die Farbzuordnung.")],["Passagen-Austausch",me("Bei aktivem Editieren sind alle Passagen anklickbar — farbige wie unmarkierte. Ein Klick öffnet ein Fenster mit Alternativen aus derselben Quelle (🎲 Neu holt weitere), dazu ✕ Entfernen, ein Freitextfeld und ein vorbefülltes Bearbeitungsfeld, um nur die Grammatik anzupassen ohne die Passage neu zu schreiben. Unmarkierte Stellen öffnen direkt das Textfeld — dort lassen sich fehlende Wörter ergänzen. Steht die Passage am Satzanfang, wird sie automatisch großgeschrieben.")],["Passende Alternativen",me("die Vorschläge werden nach inhaltlicher Nähe zum umgebenden Text sortiert — Kandidaten, die Wörter des Absatzes aufgreifen, stehen oben. „🎲 Neu“ mischt innerhalb der passendsten Vorschläge neu.")],["Bauplan (nur Rekombination)",me("Schalter neben der Legende: zeigt unter dem Text, aus welchen Bausteinen er entstanden ist — gegliedert nach Erzählphase (Eröffnung, Verdichtung, Umschlag, Schluss) und mit der Herkunft jedes Teils (Motiv, Haken, Requisite, Wendung, Hindernis, Einsatz, Ende oder Fügeteil). Eingerückte Zeilen zeigen, was in eine Leerstelle eingesetzt wurde. Macht den Bogen sichtbar und deckt auf, wenn ein Baustein an der falschen Stelle landet.")],["↩ Rückgängig",me("Chip rechts in der Legende (oder Strg/Cmd+Z) nimmt die letzten Änderungen am Text zurück — bis zu zwölf Schritte. Der Verlauf beginnt bei jeder neuen Generierung von vorn.")]])),t.append(Ft("ranking","Test & Ranking (im Studio, aufklappbar)",[["Probe (50)",me("generiert 50 Varianten und meldet auffällige/doppelte.")],["Ranking (50)",me("bewertet 50 Varianten offline (Längentreue, Wortvielfalt, Satzrhythmus, wenig Wiederholung) und sortiert sie.")],["Kohärenz-Kriterien",me("in Bewertung und Bestenauslese fließen zusätzlich ein: ",s("b",{},"Tempus")," (Fassungen mit Sprüngen zwischen Präsens und Präteritum werden abgewertet), ",s("b",{},"Phrasen-Wiederholung")," (wiederkehrende Drei- und Viergramme im selben Text) und ",He("Figurendisziplin","werkzeug"),". Der Abgleich gegen die Schatzkammer läuft weiterhin über „Neuheit“.")],["Platz 1 / 2 / 3 und Rang",me("laden Platz 1–3 bzw. blättern per Regler durch alle Ränge. Der Bereich ist in drei Schritte gegliedert: erzeugen und bewerten, Bewertungsmaßstab einstellen, Ergebnis wählen. Neuheit und Überraschung lassen sich per Schloss festhalten.")]])),t.append(Ft("preset2","Preset 2.0 (Dramaturgie)",[["Was 2.0 kann",me("Erweitert eine ",He("Wortbank","tabs")," um einen dramaturgischen Überbau: Erzählbogen (Einstieg → Mitte → Höhepunkt → Schluss), Auslöser & Veränderungen, typische Konflikte, Zeitanomalien, Weltregeln und Kontext-Pools.")],["Dramaturgie-Struktur",me("Im Studio unter ",He("Struktur","werkzeug")," die Option „Dramaturgie (Preset 2.0)“: baut den Text entlang des Erzählbogens des aktiven 2.0-Presets.")],["2.0-Felder übernehmen",me("Im Wortbank-Tab editierbar (nur bei aktivem 2.0-Preset); übernimmt Dramaturgie, Pools und Ton. Eigene Presets mit 2.0-Daten sind in der Preset-Liste mit ✦ 2.0 markiert.")],["Per KI aktualisieren",me("Verbessert das aktive Preset per KI (Grammatik/Artikel, mehr Einträge, füllt die Dramaturgie-/2.0-Felder) — das Thema bleibt. „Mehrere Presets per KI aktualisieren“ erledigt das im Stapel. Braucht einen API-Schlüssel.")],["Preset 2.0 erzeugen",me("Baut per KI ein komplettes neues 2.0-Preset aus einer kurzen Vorgabe. Braucht einen API-Schlüssel.")]])),t.append(Ft("sichern","Sichern & Übertragen",[["Exportieren (oben rechts)",me("sichert das GESAMTE Projekt als eine JSON-Datei: Wortbank, Presets, Korpus, Einstellungen, Schatzkammer, Ideen-/Omni-Presets, lebendige Pools und alle Werkstatt-Projekte. Für Backup oder Übertragung auf ein anderes Gerät.")],["Importieren (oben rechts)",me("liest so eine Datei wieder ein und ERSETZT den gesamten aktuellen Stand (mit Rückfrage).")],["Werkstatt-Projekt speichern (im Tab Werkstatt)",me("speichert NUR die aktuelle Geschichte (Quelle, Vorgaben, Gerüst, Fassungen) unter einem Namen im Browser — keine Datei.")]])),t.append(Ft("disclaimer","Hinweise & Haftungsausschluss",[["Maschinell erzeugte Texte",me("die Divergenzmaschine setzt Texte prozedural aus Wortbank-Bausteinen, Vorlagen und einem statistischen Markov-Modell zusammen. Sie ",s("b",{},"versteht")," nicht, was sie schreibt. Aussagen in den Texten sind weder recherchiert noch wahr — sie können sachlich falsch, widersprüchlich oder unfreiwillig komisch sein. Nichts davon ist Information, Rat oder Meinung.")],["Verantwortung",me("für alles, was du mit den erzeugten Texten tust — veröffentlichen, weitergeben, einreichen — bist allein du verantwortlich. Prüfe Texte vor jeder Verwendung. Bei Veröffentlichung ist ein Hinweis auf die maschinelle Erzeugung fair und in manchen Zusammenhängen (Schule, Hochschule, Wettbewerbe, Presse) verpflichtend.")],["Namen, Werke, Personen",me("Presets tragen Namen realer Autorinnen und Autoren (Goethe, Eichendorff, Dickens, Hugo …). Sie bezeichnen e
